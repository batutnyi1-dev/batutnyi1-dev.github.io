<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff3df">
  <meta name="description" content="Сайт Батутного центра №1 временно находится на техническом обслуживании. Свяжитесь с центром по телефону или электронной почте.">
  <title>Техническое обслуживание — Батутный центр №1</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #29251f;
      background: #fff3df;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #fffaf1 0%, #fff3df 65%, #ffe6bf 100%);
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgb(210 142 38 / 18%);
      border-radius: 24px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 20px 60px rgb(87 57 16 / 12%);
      text-align: center;
    }

    .mark {
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 28px;
      place-items: center;
      border-radius: 50%;
      background: #fff0d4;
      color: #bd7817;
      font-size: 36px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 20px 0 0;
      color: #62594c;
      font-size: 17px;
      line-height: 1.65;
    }

    .contact {
      display: grid;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #eee2d0;
    }

    .contact-label {
      margin: 0 0 2px;
      color: #796744;
      font-size: 14px;
    }

    a {
      color: #8a5711;
      font-size: 16px;
      font-weight: 700;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    a:hover { color: #c17b16; }

    footer {
      margin-top: 28px;
      color: #8a8174;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🔧</div>
    <h1>Сайт временно на техническом обслуживании</h1>
    <p class="intro">Мы обновляем информацию на сайте. Пожалуйста, зайдите немного позже. Актуальную информацию о работе центра можно уточнить напрямую:</p>

    <section class="contact" aria-label="Контакты центра">
      <p class="contact-label">Телефон</p>
      <a href="tel:+78002342409">8 (800) 234-24-09</a>
      <a href="tel:+79807131385">8 (980) 713-13-85</a>
      <p class="contact-label">Электронная почта</p>
      <a href="mailto:freehover29@yandex.ru">freehover29@yandex.ru</a>
    </section>

    <footer>Батутный центр №1 · Обнинск</footer>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .catch((error) => console.error("Не удалось обновить кэш сайта:", error));
      });
    }
  </script>
</body>
</html>
